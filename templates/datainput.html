<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>교실 시뮬레이션 학생 데이터 수집</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; resize: vertical; }
        button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-add { background-color: #007bff; color: white; }
        .btn-export { background-color: #28a745; color: white; margin-left: 10px; }
        .result-area { margin-top: 20px; }
        pre { background: #e9ecef; padding: 15px; border-radius: 4px; overflow-x: auto; font-size: 14px; }
        .student-list { margin-top: 15px; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>학생 데이터 입력 폼</h2>
    
    <div class="form-group">
        <label for="bulkInput">학생 데이터 일괄 입력</label>
        <textarea id="bulkInput" rows="5" placeholder="예: (홍길동, 175.5, 1), (김철수, 180.2, 0)"></textarea>
        <small style="color: #718093; display: block; margin-top: 5px;">* 형식: (이름, 키, 시력 상태) - 쉼표로 구분하여 여러 명 입력 가능 (시력: 좋음 1, 나쁨 0)</small>
    </div>

    <button type="button" class="btn-add" onclick="addStudent()">학생 추가</button>
    <button type="button" class="btn-export" onclick="sendToBackend()">자리 배치하기 (백엔드 전송)</button>

    <h3>현재 추가된 학생 목록 (<span id="count">0</span>명)</h3>
    <div id="studentList" class="student-list">추가된 학생이 없습니다.</div>

    <div class="result-area">
        <h3>Python 변환용 JSON 결과물</h3>
        <pre id="jsonOutput">이곳에 결과 JSON 문자열이 표시됩니다.</pre>
    </div>
</div>

<script>
    // 학생 데이터를 누적 저장할 배열 (Python의 list[dict] 구조로 매핑됨)
    const studentDataArray = [];

    function addStudent() {
        const bulkInput = document.getElementById('bulkInput');
        const text = bulkInput.value.trim();

        if (!text) {
            alert('데이터를 입력해 주세요.');
            return;
        }

        // (이름, 키, 시력) 형식을 매칭하는 정규표현식
        const regex = /\(([^,]+),\s*([^,]+),\s*([^)]+)\)/g;
        let match;
        let countAdded = 0;

        while ((match = regex.exec(text)) !== null) {
            const name = match[1].trim();
            const height = parseFloat(match[2].trim());
            const visionStatus = parseInt(match[3].trim(), 10);

            if (name && !isNaN(height) && (visionStatus === 0 || visionStatus === 1)) {
                // 이름 중복 검사 후 리스트에 추가
                const isDuplicate = studentDataArray.some(s => s.name === name);
                if (!isDuplicate) {
                    studentDataArray.push({
                        name: name,
                        height: height,
                        vision_status: visionStatus
                    });
                    countAdded++;
                }
            }
        }

        if (countAdded > 0) {
            updateStudentListUI();
            alert(`${countAdded}명의 학생이 추가되었습니다.`);
            bulkInput.value = '';
        } else {
            alert('올바른 학생 데이터 형식을 찾지 못했습니다.\n입력 형식 예시: (홍길동, 175.5, 1), (김철수, 180.2, 0)');
        }
    }

    function updateStudentListUI() {
        const listDiv = document.getElementById('studentList');
        const countSpan = document.getElementById('count');
        
        countSpan.innerText = studentDataArray.length;

        if (studentDataArray.length === 0) {
            listDiv.innerHTML = '추가된 학생이 없습니다.';
            return;
        }

        listDiv.innerHTML = studentDataArray.map((s, index) => 
            `<div>[${index + 1}] 이름: ${s.name} | 키: ${s.height}cm | 시력: ${s.vision_status === 1 ? '좋음(1)' : '나쁨(0)'}</div>`
        ).join('');
    }

    async function sendToBackend() {
        if (studentDataArray.length === 0) {
            alert('데이터가 없습니다. 먼저 학생을 추가하십시오.');
            return;
        }
        
        try {
            const response = await fetch('/api/set-students', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(studentDataArray)
            });
            
            if (response.ok) {
                // 성공 시 자리 배치 페이지로 이동
                window.location.href = '/arrange';
            } else {
                alert('데이터 전송에 실패했습니다.');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('서버 오류가 발생했습니다.');
        }
    }
</script>

</body>
</html>
