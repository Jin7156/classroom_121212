<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자리 배치 프로그램 (사용자 함수 연동형)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f5f6fa;
            padding: 20px;
        }

        h1 {
            color: #2f3640;
            margin-bottom: 10px;
        }

        .config-container {
            background-color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .config-container label {
            font-weight: bold;
            color: #487eb0;
        }

        .config-container input {
            width: 50px;
            padding: 5px;
            font-size: 16px;
            text-align: center;
            border: 1px solid #dcdde1;
            border-radius: 4px;
        }

        .btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-blue { background-color: #00a8ff; color: white; }
        .btn-blue:hover { background-color: #0097e6; }

        .btn-green { 
            padding: 12px 28px;
            font-size: 16px;
            background-color: #4cd137; 
            color: white; 
            margin-bottom: 25px;
        }
        .btn-green:hover { background-color: #44bd32; }

        .guide-text {
            font-size: 14px;
            color: #718093;
            margin-bottom: 15px;
        }

        .classroom-grid {
            display: grid;
            gap: 15px;
            max-width: 90%;
            width: fit-content;
            margin-bottom: 30px;
        }

        .desk {
            background-color: white;
            border: 2px solid #dcdde1;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-width: 100px;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        .desk:hover {
            border-color: #00a8ff;
            transform: translateY(-2px);
        }

        .desk-number {
            font-size: 11px;
            color: #7f8c8d;
            margin-bottom: 5px;
        }

        .student-name {
            font-size: 16px;
            font-weight: bold;
            color: #2f3640;
        }

        .empty { color: #c2c2c2; font-style: italic; font-weight: normal; }

        .desk.excluded {
            background-color: #dcdde1;
            border-color: #b2bec3;
            box-shadow: none;
        }
        .desk.excluded .student-name {
            color: #636e72;
            font-size: 14px;
            font-weight: normal;
        }
    </style>
</head>
<body>

    <h1>🪑 자동 자리 배치 시스템</h1>
    <p class="guide-text">💡 제외할 자리를 클릭한 후 [배치하기] 버튼을 누르세요.</p>
    
    <div class="config-container">
        <label for="input-rows">행(세로):</label>
        <input type="number" id="input-rows" value="4" min="1" max="10">
        
        <label for="input-cols">열(가로):</label>
        <input type="number" id="input-cols" value="5" min="1" max="10">
        
        <button class="btn btn-blue" onclick="setupGrid()">구조 적용</button>
    </div>

    <button class="btn btn-green" onclick="arrangeSeats()">배치하기</button>

    <div class="classroom-grid" id="classroom"></div>

    <script>
        let seatData = [];

        // 행/열 구조 초기화 함수
        function setupGrid() {
            const rows = parseInt(document.getElementById('input-rows').value) || 4;
            const cols = parseInt(document.getElementById('input-cols').value) || 5;
            
            seatData = [];
            let count = 1;

            for (let r = 1; r <= rows; r++) {
                for (let c = 1; c <= cols; c++) {
                    seatData.push({
                        id: count++,
                        row: r,
                        col: c,
                        name: "",          
                        isExcluded: false  // 백엔드 및 알고리즘 구분용 (true: 제외, false: 포함)
                    });
                }
            }

            const classroom = document.getElementById('classroom');
            classroom.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            renderSeats();
        }

        // 자리 제외/포함 토글 함수
        function toggleExclude(id) {
            const seat = seatData.find(s => s.id === id);
            if (seat) {
                seat.isExcluded = !seat.isExcluded;
                if (seat.isExcluded) seat.name = ""; // 제외되면 이름 초기화
                renderSeats();
            }
        }

        // 화면 렌더링 함수
        function renderSeats() {
            const classroom = document.getElementById('classroom');
            classroom.innerHTML = '';

            seatData.forEach(seat => {
                const desk = document.createElement('div');
                desk.className = 'desk';
                desk.onclick = () => toggleExclude(seat.id);

                if (seat.isExcluded) {
                    desk.classList.add('excluded');
                }

                const seatNum = document.createElement('div');
                seatNum.className = 'desk-number';
                seatNum.innerText = `${seat.row}행-${seat.col}열`;

                const studentName = document.createElement('div');
                studentName.className = 'student-name';
                
                if (seat.isExcluded) {
                    studentName.innerText = "✖ 제외됨";
                } else if (seat.name) {
                    studentName.innerText = seat.name;
                } else {
                    studentName.innerText = "빈 자리";
                    studentName.classList.add('empty');
                }

                desk.appendChild(seatNum);
                desk.appendChild(studentName);
                classroom.appendChild(desk);
            });
        }


        // ==========================================
        // 🛠️ 여기서부터 본인의 로직을 연결하시면 됩니다.
        // ==========================================

        /**
         * 1. 백엔드에서 가시성 시뮬레이션 기반으로 배치된 학생 이름 배열을 가져오는 함수
         * @returns {Promise<string[]>} 백엔드에서 반환된 이름 배열
         */
        async function fetchArrangedStudents() {
            const rows = parseInt(document.getElementById('input-rows').value) || 4;
            const cols = parseInt(document.getElementById('input-cols').value) || 5;
            const excluded_seats = seatData.filter(s => s.isExcluded).map(s => s.id);

            try {
                const response = await fetch('/api/arrange-seats', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        rows: rows,
                        cols: cols,
                        excluded_seats: excluded_seats
                    })
                });

                if (!response.ok) {
                    throw new Error('데이터를 불러오는데 실패했습니다.');
                }
                const data = await response.json();
                
                if (data.average_visibility !== undefined) {
                    alert(`자리 배치 완료!\n(모든 학생의 평균 시야 가시성: ${data.average_visibility.toFixed(1)}%)`);
                }
                return data.arranged_names || [];
            } catch (error) {
                console.error('Error fetching students:', error);
                alert('학생 데이터를 서버에서 불러오지 못했습니다.');
                return [];
            }
        }

        /**
         * 2. [배치하기] 버튼을 누르면 작동하는 핵심 이벤트 함수
         */
        async function arrangeSeats() {
            // 백엔드에서 정렬된 배열을 비동기로 받아옵니다.
            const sortedNames = await fetchArrangedStudents();
            
            // 배열이 정상적으로 넘어왔는지 검증
            if (!Array.isArray(sortedNames)) {
                alert("오류: 리턴된 데이터가 배열 형식이 아닙니다.");
                return;
            }

            if (sortedNames.length === 0) {
                alert("배치할 학생 데이터가 없습니다. 먼저 입력 페이지에서 학생을 추가해주세요.");
                // 필요하다면 window.location.href = '/' 로 이동
                return;
            }

            let nameIndex = 0;

            // 전체 자리를 돌면서 순차적으로 데이터를 주입합니다.
            seatData.forEach(seat => {
                if (seat.isExcluded) {
                    // 제외된 자리는 확실하게 빈값 유지
                    seat.name = ""; 
                } else {
                    // 제외되지 않은 자리이고, 리턴받은 배열에 아직 넣을 원소가 남아있다면 순차 주입
                    if (nameIndex < sortedNames.length) {
                        seat.name = sortedNames[nameIndex++]; 
                    } else {
                        // 자리는 남았는데 넣을 이름 배열이 끝났다면 빈자리 처리
                        seat.name = ""; 
                    }
                }
            });

            // 데이터 반영 후 UI 갱신
            renderSeats();
            console.log("배치 완료 후 전체 데이터 상태:", seatData);
        }

        // 초기 격자 로드 (기본 4x5)
        setupGrid();
    </script>
</body>
</html>
